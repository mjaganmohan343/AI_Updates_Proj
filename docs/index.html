<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily AI & Semiconductor Intelligence Briefing</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-heading: #58a6ff;
            --accent-green: #3fb950;
            --accent-purple: #bc8cff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 24px 16px;
        }
        .container {
            max-width: 920px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .header-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .badge {
            background: linear-gradient(135deg, #1f6feb, #8957e5);
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            margin-right: 6px;
        }
        .live-tag {
            color: #8b949e;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
        }
        h1, h2, h3 {
            color: var(--text-heading);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        h1 { font-size: 2.1rem; color: #f0f6fc; margin-top: 0; }
        h2 { font-size: 1.45rem; margin-top: 36px; color: var(--accent-purple); }
        h3 { font-size: 1.15rem; color: var(--text-heading); border: none; margin-top: 24px; }
        strong { color: #f0f6fc; }
        ul { padding-left: 22px; }
        li { margin-bottom: 8px; }
        p { margin: 12px 0; }
        hr { border: 0; border-top: 1px solid var(--border-color); margin: 30px 0; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-meta">
            <span class="badge">Autonomous Intelligence</span>
            <span class="live-tag"><span class="status-dot"></span> 24h Intelligence Cycle Active</span>
        </div>
        <div id="content">Loading report...</div>
        <footer>
            Autonomous Daily AI & Semiconductor Analyst • Automated via \$0 Cloud Pipeline • Powered by Free Google Gemini API
        </footer>
    </div>
    <script>
        fetch('index.md')
            .then(response => {
                if (!response.ok) throw new Error('Markdown file fetch failed');
                return response.text();
            })
            .then(markdown => {
                document.getElementById('content').innerHTML = marked.parse(markdown);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('content').innerHTML = "<p>Unable to load markdown directly. Please check index.md.</p>";
            });
    </script>
</body>
</html>
